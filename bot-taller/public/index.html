<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Taller Mecánico - WhatsApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">
    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <span class="text-3xl">🚗🔧</span>
            <div>
                <h1 class="font-bold text-lg">Taller Mecánico - Bot de WhatsApp</h1>
                <p id="status-conexion" class="text-xs text-yellow-400">Conectando...</p>
            </div>
        </div>
        <div class="bg-slate-700 px-3 py-1 rounded-full text-xs font-mono">
            Cliente: <span id="cliente-numero" class="text-emerald-400 font-bold">663386727</span>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col md:flex-row gap-4">
        <div class="w-full md:w-1/3 bg-slate-800 border border-slate-700 rounded-xl p-4 flex flex-col items-center justify-center text-center shadow-lg">
            <h2 class="font-bold mb-2 text-slate-300">QR de WhatsApp</h2>
            <div id="qr-container" class="bg-white p-2 rounded-lg mb-3 min-h-[180px] flex items-center justify-center text-slate-900 font-semibold text-sm">
                Esperando código QR...
            </div>
            <p class="text-xs text-slate-400">Escanea este código con tu WhatsApp para vincular el bot.</p>
        </div>

        <div class="w-full md:w-2/3 bg-slate-800 border border-slate-700 rounded-xl flex flex-col shadow-lg overflow-hidden h-[500px]">
            <div class="bg-slate-700/50 p-3 border-b border-slate-700 font-semibold text-sm">💬 Chat en Vivo</div>
            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 font-sans text-sm flex flex-col">
                <div class="self-center bg-slate-700/60 text-slate-300 text-xs px-3 py-1 rounded-full">Historial iniciado</div>
            </div>
            <div class="p-3 bg-slate-700/30 border-t border-slate-700 flex gap-2">
                <input id="message-input" type="text" placeholder="Escribe un mensaje..." 
                    class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-emerald-500">
                <button id="send-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-4 py-2 rounded-lg text-sm">Enviar</button>
            </div>
        </div>
    </main>

    <footer class="text-center p-4 text-xs text-slate-500 border-t border-slate-800">Bot de Taller en Railway 🚀</footer>

    <script>
        const socket = io();
        const statusConexion = document.getElementById('status-conexion');
        const qrContainer = document.getElementById('qr-container');
        const chatMessages = document.getElementById('chat-messages');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const clienteNumeroSpan = document.getElementById('cliente-numero');

        socket.on('status', (data) => {
            statusConexion.textContent = data.status;
            if (data.qr) {
                qrContainer.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(data.qr)}" alt="QR" class="rounded">`;
            } else if (data.status.includes('Conectado')) {
                qrContainer.innerHTML = `<span class="text-emerald-600 font-bold">✅ ¡Conectado!</span>`;
            }
        });

        socket.on('set-numero-cliente', (num) => { clienteNumeroSpan.textContent = num; });

        socket.on('nuevo-mensaje', (data) => {
            const div = document.createElement('div');
            div.className = `p-3 rounded-xl max-w-[80%] ${data.fromMe ? 'bg-emerald-600/20 border border-emerald-600/40 self-end text-right' : 'bg-slate-700 self-start text-left'}`;
            div.innerHTML = `<span class="block text-[10px] font-bold text-slate-400 mb-1">${data.sender}</span><span>${data.text}</span>`;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });

        function enviarMensaje() {
            const text = messageInput.value.trim();
            if (!text) return;
            socket.emit('enviar-mensaje-web', { text });
            messageInput.value = '';
        }

        sendBtn.addEventListener('click', enviarMensaje);
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') enviarMensaje(); });
    </script>
</body>
</html>
